[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gif2grid-mcp"
version = "0.1.0"
description = "An MCP server that turns animated images into one timestamped contact sheet, so agents can actually see motion instead of one still frame."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shen Xun", email = "2338923971@qq.com" }]
keywords = ["mcp", "multimodal", "vision", "gif", "llm", "agent"]
dependencies = ["mcp>=2.0", "Pillow>=9.4", "gif2grid>=0.1.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
gif2grid-mcp = "gif2grid_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
